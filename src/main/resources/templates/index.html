<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order form</title>
</head>
<body>
    <h1>New Order Details</h1>
    <form action="/api/order" method="post">
        <div>
            <label for="registration">Registration:</label>
            <select name="registration" id="registration">
                <span th:each="name : ${names}">
                    <option th:value="${name}" th:label="${name}"></option>
                </span>
            </select>
        </div>
        <div>
            <label for="customerName">Customer Name:</label><br>
            <input name="customerName" id="customerName" type="text">
        </div><br>
        <div>
            <label for="shipAddress">Shipping Address:</label><br>
            <input name="shipAddress" id="shipAddress" type="text">
        </div><br>
        <div>
            <label for="notes">Notes:</label><br>
            <textarea id="notes" name="notes"></textarea>
        </div>
        <p>Items:</p>
        <button type="button" id="btn" onclick="addNewRow()">Add Item</button>
        <div>
            <table id="tbl">
                <thead>
                    <tr>
                        <th>Product</th>
                        <th>Unit Price</th>
                        <th>Quantity</th>
                    </tr>
                </thead>
                <tbody id="tbody">
                    <tr id="tr">
                        <td>
                            <input name="product" id="product" type="text">
                        </td>
                        <td>
                            <input name="unitPrice" id="unitPrice" type="number" step="0.1" value="0.1">
                        </td>
                        <td>
                            <input name="quantity" id="quantity" type="number" value="1">
                        </td>
                        <td>
                            <button type="button" id="del" onclick="deleteRow()">Remove</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <button type="submit">Submit</button>
    </form>
    <script>
        function addNewRow()
        {
            var tr = document.getElementById('tr').cloneNode(true);
            document.getElementById('tbl').appendChild(tr);
        }
        function deleteRow()
        {   
            var btn = document.getElementById("del");
            btn.closest('tr').remove();
        }
    </script>
</body>
</html>
